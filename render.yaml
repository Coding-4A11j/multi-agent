services:
  - type: web
    name: multi-agent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (or via API) — never commit their values.
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: API_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
